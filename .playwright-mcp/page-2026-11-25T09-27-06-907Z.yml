            - generic [ref=f1e163]:
              - generic [ref=f1e164]: "Whether you hike, bike, run, or walk, AllTrails is your companion and guide to the outdoors. Find detailed reviews and inspiration from a community of trailgoers like you. We’ll help you plan, live, and share your outdoor adventures.AllTrails offers more than a running app or fitness activity tracker. It helps you discover dog-friendly, child-friendly, pram-friendly, or wheelchair-friendly trails, and more with turn-by-turn navigation to guide you through it.◆ Discover trails: Search over 500,000 trails around the world by location, interest, skill level, and more.◆ Plan your next adventure: Get in-depth trail info, from reviews to conditions to GPS driving directions — and save your favorite trails for later.◆ Stay on course: Stick to your planned route or chart your own course with confidence when you navigate on the trail with your phone or Wear OS device. Use Wear OS to leverage tiles and complications to start and monitor your activities.◆ Find points of interest: Discover waterfalls, historic sites, photo spots, and more along the trail.◆ Grow your community: Celebrate outdoor adventures and find inspiration by connecting with trailgoers like you.◆ Share your outdoor adventures: Easily post trails and activities on Facebook, Instagram, or WhatsApp.◆ Record your activity: Capture your stats, leave reviews, and post photos of your favorite walking trails.Discover trails that fit your nature. Trails for workout planners, hikers, walkers, mountain bikers, trail runners, and casual cyclists. Whether you’re pushing your limits or pushing a pram, there’s something out there for everyone. Let AllTrails help you find it.► Do more outdoors with AllTrails Plus►Spend less time figuring out where you want to be, and more time enjoying where you are. With offline maps, wrong-turn alerts, and extra safety and planning features, your annual subscription gives you more tools for more adventures.◆ Search by distance from you to find the closest trails.◆ Plan for the elements like ground conditions, weather, air quality, UV index, and more.◆ See how conditions change along the trail and preview by time of day.◆ Unplug completely or pack a backup with printed maps.◆ Explore without signal with map downloads for trails, parks, and entire areas.◆ Live share your trail activity with friends and family.◆ Prepare for the hills ahead: Follow topo maps and trail maps in 3D.◆ Focus on the view, not the map, with wrong-turn alerts.◆ Give back: AllTrails donates a portion of every subscription to 1% for the Planet.◆ Explore ad-free: Remove occasional ads by subscribing► New! Explore to the fullest with AllTrails Peak ►Make the most of your time on the trail with our newest premium membership. Chart your own course, plan ahead for conditions, and explore popular trails — with all the offline benefits of Plus.◆ Create your own route from scratch, or modify one of 500,000+ existing trails.◆ Explore the most popular places with heatmaps of recent trail activity.◆ Access every Plus and Base feature, too.Whether you’re geocaching in a national park, browsing bucket-list mountain bike routes, or planning a trail run to clear your head, AllTrails Plus and Peak make the great outdoors even greater."
