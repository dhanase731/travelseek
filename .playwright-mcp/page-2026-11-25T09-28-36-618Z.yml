        - generic [ref=f13e54]:
          - heading "Live Locations, Media Player and Languages" [level=1] [ref=f13e56]
          - generic [ref=f13e57]:
            - link [ref=f13e60] [cursor=pointer]:
              - /url: /file/811140800/15ac/dbUnAN7v3is.132207/89052c9f12dbb51f7b
              - img "Meet Telegram 4.4! Live Locations, Media Player and More Languages" [ref=f13e61]
            - paragraph [ref=f13e62]:
              - text: Starting with
              - strong [ref=f13e63]: Telegram 4.4
              - text: ", you can broadcast your current location to any chat in real time."
            - paragraph [ref=f13e64]:
              - text: This is useful when you are on your way to an appointment or are trying to coordinate with friends at a large event. Instead of sending static locations on the map every minute, you can now share your
              - strong [ref=f13e65]: Live Location
              - text: with the people you’re meeting – for
              - strong [ref=f13e66]: "15"
              - text: minutes,
              - strong [ref=f13e67]: "1"
              - text: hour, or
              - strong [ref=f13e68]: "8"
              - text: hours.
            - paragraph [ref=f13e69]: "To use this feature, select ‘Location’ from the attachment menu and choose ‘Share My Location for…’:"
            - generic [ref=f13e72] [cursor=pointer]
            - paragraph [ref=f13e73]: You can also share your Live Location in groups, and if other members of the group do the same, you’ll get an interactive map of everyone’s current coordinates. Thanks to a bar at the top of the screen, you will always remember who you’re sharing your location with. And you only need two taps to stop sharing whenever you choose to.
            - heading "New Media Player" [level=3] [ref=f13e74]:
              - link [ref=f13e75]:
                - /url: "#new-media-player"
                - generic [ref=f13e76] [cursor=pointer]
              - text: New Media Player
            - paragraph [ref=f13e77]:
              - text: We’ve completely redesigned our in-app audio player to better support the playback of MP3s and other music files you send and receive. Try the
              - link "@cctracks" [ref=f13e78] [cursor=pointer]:
                - /url: https://t.me/cctracks
              - text: channel for a demo – we’ve uploaded some free music there to demonstrate how the new media player works. After downloading an audio file, tap the play button to start listening. To view the cover image and the rest of the chat's playlist, tap on the title of the playing track in the top bar.
            - generic [ref=f13e81] [cursor=pointer]
            - heading "More Languages" [level=3] [ref=f13e82]:
              - link [ref=f13e83]:
                - /url: "#more-languages"
                - generic [ref=f13e84] [cursor=pointer]
              - text: More Languages
            - paragraph [ref=f13e85]:
              - text: We’re also launching a new
              - link "translation platform" [ref=f13e86] [cursor=pointer]:
                - /url: https://translations.telegram.org
              - text: for Telegram apps. Starting today, Telegram is available in French, Indonesian, Malay, Russian and Ukrainian – with more languages like Persian coming soon. Telegram now supports 13 languages, which are available in Settings.
            - paragraph [ref=f13e87]:
              - text: If you don’t like how a specific element in Telegram's interface is translated in your language, you can now use the
              - link "localization platform" [ref=f13e88] [cursor=pointer]:
                - /url: https://translations.telegram.org
              - text: to suggest an alternative word or phrase. Everyone can suggest translations and vote for them, making Telegram localization a community-driven effort.
            - generic [ref=f13e89]:
              - link [ref=f13e90] [cursor=pointer]:
                - /url: /file/811140498/18bc/jBRVpju9nLM.42250/7b13fd34bd9622a5e6
                - img "New Localization Platform for Telegram Apps" [ref=f13e91]
              - paragraph [ref=f13e92]: Screenshots make translations easier
            - paragraph [ref=f13e93]: Unlike other services, Telegram can instantly push new translations of words and phrases to the apps. Thanks to this, users won't need to wait for an update in the stores to get the new localized version.
            - paragraph [ref=f13e94]: This also means that our developers won't have to wait for all translations to be finished before the apps are released, so this new interface will speed up Telegram development too.
            - heading "Better Group Chats" [level=3] [ref=f13e95]:
              - link [ref=f13e96]:
                - /url: "#better-group-chats"
                - generic [ref=f13e97] [cursor=pointer]
              - text: Better Group Chats
            - paragraph [ref=f13e98]: As always, we’re trying to make Telegram group chats better. In large groups, you can now recognize messages from admins by the new ‘admin’ badge. And Admins in supergroups can now control whether new members get to see the earlier message history.
            - paragraph [ref=f13e100]:
              - emphasis [ref=f13e101]: October 10, 2017The Telegram Team
